<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />
</head>
<body>
    <main>

        <div class="card">

            <div class="left"></div>
            
            <div class="right"></div>

            <div class="pokemon-logo">
                <img src="./pokemon staker.png" 
                alt="">
            </div>

            <div class="pokemon-Info">
                <h6>POKEMON GEN II</h6>

                <h1>Pikachu</h1>

                <p>Pikachu is an Electric-type Pokemon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pokemon.
                    They are almost completely covered by
                    yellow fur.
                </p>

                <span class="date">01/18</span>

            </div>

            <div class="pokemon-image">
                <img src="./pokemon.png" alt="">
            </div>

            <div class="menu-icon">
                <i class="ri-menu-line"></i>
            </div>

        </div>

    </main>
</body>
</html>
